kind = "web"
previewPath = "/"
title = "Sediba Aesthetic & Wellness Clinic"
version = "1.0.0"
id = "artifacts/sediba-clinic"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18944

[services.development]
run = "pnpm --filter @workspace/sediba-clinic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sediba-clinic", "run", "build" ]
publicDir = "artifacts/sediba-clinic/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18944"
BASE_PATH = "/"
