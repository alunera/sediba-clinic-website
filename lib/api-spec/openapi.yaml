    ClinicSaleEntry:
      type: object
      required: [id, kind, amountCents, method, reason, createdAt]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [payment, refund] }
        amountCents: { type: integer }
        method: { type: string }
        reason: { type: string }
        createdAt: { type: string }
    ClinicSale:
      type: object
      required: [id, reference, clientId, clientName, items, totalCents, paidCents, refundedCents, outstandingCents, status, notes, createdAt, entries, voidReason]
      properties:
        id: { type: integer }
        reference: { type: string }
        clientId: { type: integer }
        clientName: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ClinicSaleItem" }
        totalCents: { type: integer }
        paidCents: { type: integer }
        refundedCents: { type: integer }
        outstandingCents: { type: integer }
        status: { type: string, enum: [unpaid, part_paid, paid, partially_refunded, refunded, void] }
        notes: { type: string }
        voidReason: { type: string }
        createdAt: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/ClinicSaleEntry" }
    ClinicFinancialRow:
      type: object
      required: [reference, clientName, source, kind, amountCents, method, createdAt]
      properties:
