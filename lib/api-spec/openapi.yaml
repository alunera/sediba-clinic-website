openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Sediba Aesthetic & Wellness Clinic
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: appointments
    description: Appointment booking operations
  - name: services
    description: Clinic services
  - name: openai
    description: OpenAI AI chat and booking assistant operations
  - name: admin
    description: Admin management operations
paths:
  /admin/stock:
    get:
      operationId: listStock
      tags: [admin]
      responses:
        "200":
          description: Stock products including archived products
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StockProduct" } }
    post:
      operationId: createStockProduct
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/StockProductInput" }
                - type: object
                  required: [requestId, openingQuantity]
                  properties:
                    requestId: { type: string, minLength: 16, maxLength: 100 }
                    openingQuantity: { type: integer, minimum: 0, maximum: 1000000 }
      responses:
        "200":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockProduct" }
  /admin/stock/{id}:
    patch:
      operationId: updateStockProduct
      tags: [admin]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/StockProductInput" }
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockProduct" }
  /admin/stock/{id}/movements:
    get:
      operationId: listStockMovements
      tags: [admin]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Immutable stock history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StockMovement" } }
    post:
      operationId: recordStockMovement
      tags: [admin]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, kind, quantity, reason]
              properties:
                requestId: { type: string, minLength: 16, maxLength: 100 }
                kind: { type: string, enum: [received, adjustment, return] }
                quantity: { type: integer, minimum: -1000000, maximum: 1000000 }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Stock movement recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockProduct" }
  /admin/appointments/{id}/refunds:
    post:
      operationId: recordAppointmentRefund
      tags: [admin]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentRefundInput" }
      responses:
        "200":
          description: Externally issued refund recorded against an original payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentReceipts" }
  /admin/bookkeeping:
    get:
      operationId: getBookkeeping
      tags: [admin]
      parameters:
        - { in: query, name: from, required: true, schema: { type: string } }
        - { in: query, name: to, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cash-basis bookkeeping and deposit matching
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookkeeping" }
  /admin/bookkeeping/expenses:
    post:
      operationId: createBookExpense
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookExpenseInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookSaved" }
  /admin/bookkeeping/expenses/{id}/void:
    post:
      operationId: voidBookExpense
      tags: [admin]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookVoidInput" }
      responses:
        "200":
          description: Voided with audit history retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookSaved" }
  /admin/bookkeeping/deposits:
    post:
      operationId: createBookDeposit
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookDepositInput" }
      responses:
        "200":
          description: Deposit matched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookSaved" }
  /admin/bookkeeping/deposits/{id}/void:
    post:
      operationId: voidBookDeposit
      tags: [admin]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookVoidInput" }
      responses:
        "200":
          description: Matching reversed, history retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookSaved" }
  /admin/appointments/{id}/receipts:
    get:
      operationId: getAppointmentReceipts
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Appointment payment balance and history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentReceipts" }
    post:
      operationId: recordAppointmentReceipt
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentReceiptInput" }
      responses:
        "200":
          description: Recorded in-salon receipt and updated booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppointmentReceipts" }
  /admin/sales:
    get:
      operationId: listAdminSales
      tags: [admin]
      responses:
        "200":
          description: Manual sales with payment and refund history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClinicSale" }
    post:
      operationId: createAdminSale
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicSaleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicSale" }
  /admin/sales/{id}/entries:
    post:
      operationId: addAdminSaleEntry
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicSaleEntryInput" }
      responses:
        "200":
          description: Updated sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicSale" }
  /admin/sales/{id}/void:
    post:
      operationId: voidAdminSale
      tags: [admin]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClinicSaleVoidInput" }
      responses:
        "200":
          description: Voided unpaid sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicSale" }
  /admin/financial-report:
    get:
      operationId: getAdminFinancialReport
      tags: [admin]
      parameters:
        - in: query
          name: from
          required: true
          schema: { type: string }
        - in: query
          name: to
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recorded receipts and manual refunds by Johannesburg transaction date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicFinancialReport" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List all appointments
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentBody"
      responses:
        "201":
          description: Created appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /appointments/{id}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get appointment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentBody"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Cancel/delete appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /appointments/availability:
    get:
      operationId: getAvailability
      tags: [appointments]
      summary: Get available time slots for a given date
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: serviceId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableSlot"

  /appointments/available-dates:
    get:
      operationId: getAvailableDates
      tags: [appointments]
      summary: List dates in a month that have at least one open slot
      parameters:
        - name: month
          in: query
          required: true
          description: "Month in YYYY-MM format"
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Available dates
          content:
            application/json:
              schema:
                type: object
                properties:
                  dates:
                    type: array
                    items:
                      type: string
                required: [dates]

  /appointments/ref/{ref}:
    get:
      operationId: getAppointmentByRef
      tags: [appointments]
      summary: Get appointment by booking reference
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all clinic services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a service by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services/categories:
    get:
      operationId: listServiceCategories
      tags: [services]
      summary: List service categories with counts
      responses:
        "200":
          description: Service categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceCategory"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login with password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Check admin authentication status
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/initiate:
    post:
      operationId: initiatePayment
      tags: [payments]
      summary: Create a Yoco payment attempt for a pending booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentBody"
      responses:
        "200":
          description: Yoco hosted-checkout redirect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentFormResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Booking not payable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payments/status:
    get:
      operationId: getPaymentStatus
      tags: [payments]
      summary: Get booking + payment status by booking reference
      parameters:
        - name: ref
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current booking and payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/appointments:
    get:
      operationId: adminListAppointments
      tags: [admin]
      summary: List all appointments (admin)
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAppointment"

  /admin/appointments/{id}:
    patch:
      operationId: adminUpdateAppointment
      tags: [admin]
      summary: Update appointment (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateAppointmentBody"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/availability:
    get:
      operationId: adminGetAvailability
      tags: [admin]
      summary: Get configured availability for a month, with booked flags (admin)
      parameters:
        - name: month
          in: query
          required: true
          description: "Month in YYYY-MM format"
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Availability per date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAvailabilityDay"

  /admin/availability/slots:
    post:
      operationId: adminAddAvailabilitySlots
      tags: [admin]
      summary: Add available time slots to a date (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAddSlotsBody"
      responses:
        "200":
          description: Updated day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAvailabilityDay"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminRemoveAvailabilitySlot
      tags: [admin]
      summary: Remove a single time slot from a date (admin)
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: time
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "409":
          description: Slot already booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/availability/dates/{date}:
    delete:
      operationId: adminClearAvailabilityDate
      tags: [admin]
      summary: Remove all unbooked slots from a date (admin)
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Result with count of removed slots and remaining booked slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: integer
                  bookedRemaining:
                    type: integer
                required: [removed, bookedRemaining]

  /admin/clients:
    get:
      operationId: adminListClients
      tags: [admin]
      summary: List all unique clients (admin)
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"

  /admin/client-records:
    get:
      operationId: listAdminClientRecords
      tags: [admin]
      summary: Search persistent client records (admin only)
      parameters:
        - in: query
          name: search
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Client records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminClientRecord" }
    post:
      operationId: createAdminClientRecord
      tags: [admin]
      summary: Create a client record (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminClientRecordInput" }
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientRecord" }
        "400":
          description: Invalid input
  /admin/client-records/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getAdminClientRecord
      tags: [admin]
      summary: Get client and linked booking history (admin only)
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientRecordDetail" }
        "404":
          description: Client not found
    patch:
      operationId: updateAdminClientRecord
      tags: [admin]
      summary: Update a client record (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminClientRecordUpdate" }
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminClientRecord" }
        "400":
          description: Invalid input
        "404":
          description: Client not found

  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin]
      summary: Get admin settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
    put:
      operationId: adminUpdateSettings
      tags: [admin]
      summary: Update admin settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"

  /admin/consultation:
    get:
      operationId: adminGetConsultationService
      tags: [admin]
      summary: Get consultation service price and duration
      responses:
        "200":
          description: Consultation service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConsultationService"
        "404":
          description: Consultation service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: adminUpdateConsultationService
      tags: [admin]
      summary: Update consultation service price and duration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminConsultationServiceUpdate"
      responses:
        "200":
          description: Updated consultation service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConsultationService"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Consultation service not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    BookSaved:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
    BookVoidInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }
    BookExpenseInput:
      type: object
      required: [requestId, date, category, payee, reference, amountCents, method, paid]
      properties:
        requestId: { type: string, minLength: 16, maxLength: 100 }
        date: { type: string }
        category:
          type: string
          enum: [rent, utilities, salaries, consumables, product_purchases, marketing, transport, bank_fees, other]
        payee: { type: string, minLength: 1, maxLength: 200 }
        reference: { type: string, minLength: 1, maxLength: 1000 }
        amountCents: { type: integer, minimum: 1, maximum: 100000000 }
        method: { type: string, enum: [cash, eft, card_external] }
        paid: { type: boolean }
    BookDepositInput:
      type: object
      required: [requestId, date, reference, bankCents, feeCents, receiptKeys, verified]
      properties:
        requestId: { type: string, minLength: 16, maxLength: 100 }
        date: { type: string }
        reference: { type: string, minLength: 1, maxLength: 200 }
        bankCents: { type: integer, minimum: 1, maximum: 100000000 }
        feeCents: { type: integer, minimum: 0, maximum: 100000000 }
        receiptKeys:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string }
        verified: { type: boolean }
    BookRow:
      type: object
      required: [key, date, kind, description, reference, category, method, amountCents, voidReason, depositId]
      properties:
        key: { type: string }
        date: { type: string }
        kind: { type: string, enum: [receipt, refund, expense, fee] }
        description: { type: string }
        reference: { type: string }
        category: { type: string }
        method: { type: string }
        amountCents: { type: integer }
        voidReason: { type: string }
        depositId: { type: ["integer", "null"] }
    BookDeposit:
      type: object
      required: [id, date, reference, bankCents, feeCents, grossCents, receiptKeys, voidReason]
      properties:
        id: { type: integer }
        date: { type: string }
        reference: { type: string }
        bankCents: { type: integer }
        feeCents: { type: integer }
        grossCents: { type: integer }
        receiptKeys:
          type: array
          items: { type: string }
        voidReason: { type: string }
    Bookkeeping:
      type: object
      required: [from, to, receivedCents, refundedCents, expenseCents, netCashCents, rows, unmatchedReceipts, deposits]
      properties:
        from: { type: string }
        to: { type: string }
        receivedCents: { type: integer }
        refundedCents: { type: integer }
        expenseCents: { type: integer }
        netCashCents: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/BookRow" }
        unmatchedReceipts:
          type: array
          items: { $ref: "#/components/schemas/BookRow" }
        deposits:
          type: array
          items: { $ref: "#/components/schemas/BookDeposit" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    InitiatePaymentBody:
      type: object
      properties:
        bookingRef:
          type: string
      required:
        - bookingRef

    PaymentFormResponse:
      type: object
      properties:
        url:
          type: string
        mode:
          type: string
          enum: [live, test]
      required:
        - url
        - mode

    PaymentStatusResponse:
      type: object
      properties:
        bookingStatus:
          type: string
        paymentStatus:
          type: string
        amountCents:
          type: integer
        paidCents: { type: integer }
        outstandingCents: { type: integer }
        inSalon: { type: boolean }
        refundedCents: { type: integer }
        netReceiptsCents: { type: integer }
      required:
        - bookingStatus
        - paymentStatus
        - amountCents
        - paidCents
        - outstandingCents
        - inSalon
        - refundedCents
        - netReceiptsCents

    Appointment:
      type: object
      properties:
        id:
          type: integer
        bookingRef:
          type: string
        clientName:
          type: string
        clientEmail:
          type: string
        clientPhone:
          type: string
        clientWhatsapp:
          type: string
          nullable: true
        serviceId:
          type: integer
        serviceName:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        totalAmountCents:
          type: integer
        status:
          type: string
          enum: [pending, pending_payment, payment_failed, confirmed, cancelled, completed, no-show]
        notes:
          type: string
          nullable: true
        policyAgreed:
          type: string
        appointmentType:
          type: string
          enum: [treatment, consultation]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - bookingRef
        - clientName
        - clientEmail
        - clientPhone
        - serviceId
        - serviceName
        - date
        - time
        - totalAmountCents
        - status
        - policyAgreed
        - appointmentType
        - createdAt

    AdminAppointment:
      allOf:
        - $ref: "#/components/schemas/Appointment"
        - type: object
          properties:
            paymentStatus:
              type: string
              enum: [paid, part_paid, pending, failed, unpaid]
            paidCents: { type: integer }
            outstandingCents: { type: integer }
            refundedCents: { type: integer }
          required:
            - paymentStatus
            - paidCents
            - outstandingCents
            - refundedCents

    CreateAppointmentBody:
      type: object
      properties:
        clientName:
          type: string
        clientEmail:
          type: string
        clientPhone:
          type: string
        clientWhatsapp:
          type: string
          nullable: true
        serviceId:
          type: integer
        date:
          type: string
          format: date
        time:
          type: string
        notes:
          type: string
          nullable: true
        policyAgreed:
          type: boolean
        appointmentType:
          type: string
          enum: [treatment, consultation]
      required:
        - clientName
        - clientEmail
        - clientPhone
        - serviceId
        - date
        - time
        - policyAgreed

    UpdateAppointmentBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, pending_payment, payment_failed, confirmed, cancelled, completed, no-show]
        notes:
          type: string
          nullable: true

    AdminUpdateAppointmentBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, pending_payment, payment_failed, confirmed, cancelled, completed, no-show]
        notes:
          type: string
          nullable: true

    AvailableSlot:
      type: object
      properties:
        time:
          type: string
        available:
          type: boolean
      required:
        - time
        - available

    AdminAvailabilityDay:
      type: object
      properties:
        date:
          type: string
        slots:
          type: array
          items:
            type: object
            properties:
              time:
                type: string
              booked:
                type: boolean
            required: [time, booked]
      required: [date, slots]

    AdminAddSlotsBody:
      type: object
      properties:
        date:
          type: string
          format: date
        times:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      required: [date, times]

    Service:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: string
        duration:
          type: integer
          description: Duration in minutes
        price:
          type: number
        imageUrl:
          type: string
          nullable: true
      required:
        - id
        - name
        - category
        - description
        - duration
        - price

    ServiceCategory:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count

    AdminLoginBody:
      type: object
      properties:
        password:
          type: string
      required:
        - password

    AdminAuthResponse:
      type: object
      properties:
        authenticated:
          type: boolean
      required:
        - authenticated

    Client:
      type: object
      properties:
        clientName:
          type: string
        clientEmail:
          type: string
        clientPhone:
          type: string
        clientWhatsapp:
          type: string
          nullable: true
        appointmentCount:
          type: integer
        totalSpentCents:
          type: integer
        lastVisit:
          type: string
          nullable: true
        firstVisit:
          type: string
          nullable: true
      required:
        - clientName
        - clientEmail
        - clientPhone
        - appointmentCount
        - totalSpentCents

    AdminClientRecord:
      type: object
      required: [id, name, email, phone, whatsapp, dateOfBirth, internalNotes, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        whatsapp: { type: [string, "null"] }
        dateOfBirth: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        internalNotes: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    AdminClientRecordInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: [string, "null"], maxLength: 254 }
        phone: { type: [string, "null"], maxLength: 40 }
        whatsapp: { type: [string, "null"], maxLength: 40 }
        dateOfBirth: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        internalNotes: { type: [string, "null"], maxLength: 10000 }
    AdminClientRecordUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: [string, "null"], maxLength: 254 }
        phone: { type: [string, "null"], maxLength: 40 }
        whatsapp: { type: [string, "null"], maxLength: 40 }
        dateOfBirth: { type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$' }
        internalNotes: { type: [string, "null"], maxLength: 10000 }
    AdminClientBooking:
      type: object
      required: [id, bookingRef, clientName, clientEmail, clientPhone, clientWhatsapp, serviceName, date, time, status, createdAt]
      properties:
        id: { type: integer }
        bookingRef: { type: string }
        clientName: { type: string }
        clientEmail: { type: string }
        clientPhone: { type: string }
        clientWhatsapp: { type: [string, "null"] }
        serviceName: { type: [string, "null"] }
        date: { type: string }
        time: { type: string }
        status: { type: string }
        createdAt: { type: string }
    AdminClientRecordDetail:
      allOf:
        - $ref: "#/components/schemas/AdminClientRecord"
        - type: object
          required: [bookings]
          properties:
            bookings:
              type: array
              items: { $ref: "#/components/schemas/AdminClientBooking" }

    AdminSettings:
      type: object
      properties:
        googleReviewUrl:
          type: string
          nullable: true
        clinicName:
          type: string
          nullable: true
        clinicAddress:
          type: string
          nullable: true
        clinicPhone:
          type: string
          nullable: true
        clinicEmail:
          type: string
          nullable: true
        workingHours:
          type: string
          nullable: true
          description: JSON string of working hours config

    AdminConsultationService:
      type: object
      properties:
        id:
          type: integer
        durationMinutes:
          type: integer
          description: Consultation duration in minutes
        priceRands:
          type: number
          description: Consultation price in Rands
      required:
        - id
        - durationMinutes
        - priceRands

    AdminConsultationServiceUpdate:
      type: object
      properties:
        durationMinutes:
          type: integer
          description: Consultation duration in minutes
          minimum: 1
        priceRands:
          type: number
          description: Consultation price in Rands
          minimum: 0
      required:
        - durationMinutes
        - priceRands

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    CreateOpenaiConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    SendOpenaiMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ClinicSaleItem:
      type: object
      required: [description, kind, quantity, unitPriceCents]
      properties:
        productId: { type: integer, minimum: 1 }
        description: { type: string, minLength: 1, maxLength: 200 }
        kind: { type: string, enum: [treatment, product] }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        unitPriceCents: { type: integer, minimum: 1, maximum: 100000000 }
    ClinicSaleInput:
