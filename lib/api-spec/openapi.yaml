        clientName: { type: string }
        source: { type: string, enum: [manual_sale, booking_payment, booking_in_salon] }
        kind: { type: string, enum: [payment, refund] }
        amountCents: { type: integer }
        method: { type: string }
        createdAt: { type: string }
    ClinicFinancialReport:
      type: object
      required: [from, to, receivedCents, refundedCents, netReceiptsCents, manualSalesCents, outstandingCents, rows]
      properties:
        from: { type: string }
        to: { type: string }
        receivedCents: { type: integer }
        refundedCents: { type: integer }
        netReceiptsCents: { type: integer }
        manualSalesCents: { type: integer }
        outstandingCents: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ClinicFinancialRow" }

    AppointmentReceiptInput:
      type: object
      required: [requestId, amountCents, method, reference, received]
      properties:
        requestId: { type: string, minLength: 16, maxLength: 100 }
        amountCents: { type: integer, minimum: 1, maximum: 100000000 }
        method: { type: string, enum: [cash, eft, card_external] }
        reference: { type: string, minLength: 1, maxLength: 1000 }
        received: { type: boolean }
    AppointmentReceipt:
      type: object
      required: [id, amountCents, method, reference, createdAt, refundedCents, refundableCents]
      properties:
        id: { type: integer }
        amountCents: { type: integer }
        method: { type: string }
        reference: { type: string }
        createdAt: { type: string }
        refundedCents: { type: integer }
        refundableCents: { type: integer }
    AppointmentRefundInput:
      type: object
      required: [requestId, paymentId, amountCents, method, reference, reason, returned]
      properties:
        requestId: { type: string, minLength: 16, maxLength: 100 }
        paymentId: { type: integer, minimum: 1 }
        amountCents: { type: integer, minimum: 1, maximum: 100000000 }
        method: { type: string, enum: [cash, eft, card_external, yoco] }
        reference: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
        returned: { type: boolean }
    AppointmentRefund:
      type: object
      required: [id, paymentId, amountCents, method, reference, reason, createdAt]
      properties:
        id: { type: integer }
        paymentId: { type: integer }
        amountCents: { type: integer }
        method: { type: string }
        reference: { type: string }
        reason: { type: string }
        createdAt: { type: string }
    AppointmentReceipts:
      type: object
      required: [appointmentId, bookingStatus, totalCents, paidCents, outstandingCents, inSalon, blockedReason, receipts, refundedCents, netReceiptsCents, refunds]
      properties:
        appointmentId: { type: integer }
        bookingStatus: { type: string }
        totalCents: { type: integer }
        paidCents: { type: integer }
        outstandingCents: { type: integer }
        inSalon: { type: boolean }
        blockedReason: { type: string }
        checkoutExceptions:
          type: array
          items:
            type: object
            required: [paymentId, attemptReference, checkoutReference, status, amountCents, createdAt]
            properties:
              paymentId: { type: integer }
              attemptReference: { type: string }
              checkoutReference: { type: string }
              status: { type: string }
              amountCents: { type: integer }
              createdAt: { type: string }
        refundedCents: { type: integer }
        netReceiptsCents: { type: integer }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/AppointmentRefund" }
        receipts:
          type: array
          items: { $ref: "#/components/schemas/AppointmentReceipt" }
    StockProductInput:
      type: object
      required: [name, sku, unit, reorderLevel, unitPriceCents, active]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        sku: { type: string, minLength: 1, maxLength: 80 }
        unit: { type: string, minLength: 1, maxLength: 40 }
        reorderLevel: { type: integer, minimum: 0, maximum: 1000000 }
        unitPriceCents: { type: integer, minimum: 1, maximum: 100000000 }
        active: { type: boolean }
    StockProduct:
      allOf:
        - { $ref: "#/components/schemas/StockProductInput" }
        - type: object
          required: [id, onHand, version]
          properties:
            id: { type: integer }
            onHand: { type: integer }
            version: { type: integer }
    StockMovement:
      type: object
      required: [id, productId, kind, quantity, reason, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        kind: { type: string }
        quantity: { type: integer }
        reason: { type: string }
        saleId: { type: integer, nullable: true }
        createdAt: { type: string }
