      properties:
        requestId: { type: string, minLength: 16, maxLength: 100 }
        kind: { type: string, enum: [payment, refund] }
        amountCents: { type: integer, minimum: 1, maximum: 100000000 }
        method: { type: string, enum: [cash, eft, card_external] }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    ClinicSaleVoidInput:
      type: object
      required: [reason]
